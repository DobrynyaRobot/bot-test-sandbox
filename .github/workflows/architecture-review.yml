name: Architecture review
run-name: "Архитектурная проверка · PR № ${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: architecture-review-${{ github.repository_id }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  architecture-review:
    if: github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # The workflow revision is from the target branch. The PR base in the
      # event can point to an earlier commit, even after the workflow changes.
      - name: Checkout trusted reviewer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false

      - name: Install Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.0"

      - name: Install locked AACT
        run: python3 src/aact_reviewer/install_engine.py

      - name: Review PR and write summary
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCH_REVIEW_POLICY: ${{ vars.ARCH_REVIEW_POLICY || '.github/architecture-review.json' }}
          PYTHONPATH: src
        run: python3 -B -m github_bot --verify-checkout

      - name: Explain setup failure
        if: failure() && steps.review.outcome == 'skipped'
        run: |
          echo '::error title=Архитектурная проверка::Ошибка подготовки. Откройте этап с ошибкой.'
          printf '%s\n' '### Архитектурная проверка · ошибка подготовки' '' \
            'Проверка зависимостей не началась. Откройте этап с ошибкой и повторите запуск после исправления.' \
            >> "$GITHUB_STEP_SUMMARY"
